name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory & Capacitor
      run: |
        # 1. Initialize package.json if missing
        if [ ! -f package.json ]; then
          npm init -y
        fi

        # 2. Install Capacitor packages
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        # 3. Create clean www directory
        mkdir -p www

        # 4. Copy all files except hidden and environment folders
        cp -R index.html *.js *.css *.png *.svg *.json www/ 2>/dev/null || true
        cp -R src www/ 2>/dev/null || true
        cp -R public/* www/ 2>/dev/null || true
        cp -R dist/* www/ 2>/dev/null || true
        cp -R build/* www/ 2>/dev/null || true

        # 5. Ensure index.html exists inside www
        if [ ! -f www/index.html ]; then
          FIRST_HTML=$(find . -maxdepth 3 -name "*.html" -not -path "./www/*" -not -path "./node_modules/*" | head -n 1)
          if [ -n "$FIRST_HTML" ]; then
            cp "$FIRST_HTML" www/index.html
          else
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>App</title></head><body><div id="root"></div></body></html>' > www/index.html
          fi
        fi

        # 6. Convert absolute paths to relative paths (fixes blank/white screen on mobile)
        sed -i 's/href="\//href=".\//g' www/index.html 2>/dev/null || true
        sed -i 's/src="\//src=".\//g' www/index.html 2>/dev/null || true
        sed -i 's/\/assets\//.\/assets\//g' www/index.html 2>/dev/null || true

        # 7. Initialize Capacitor
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Conflicts & Build APK
      run: |
        cd android

        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'
