name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory & Capacitor
      run: |
        # Create package.json if missing
        if [ ! -f package.json ]; then
          npm init -y
        fi

        # Install Capacitor packages
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        # Create output www folder
        mkdir -p www

        # Locate the real index.html or primary HTML file anywhere in the repo (ignoring node_modules/android)
        TARGET_HTML=$(find . -name "*.html" -not -path "*/node_modules/*" -not -path "*/android/*" -not -path "*/www/*" | head -n 1)

        if [ -n "$TARGET_HTML" ]; then
          # Find the folder containing that HTML file and copy everything from it into www
          SOURCE_DIR=$(dirname "$TARGET_HTML")
          echo "Found source web folder at: $SOURCE_DIR"
          cp -R "$SOURCE_DIR"/* www/
          
          # Rename the main HTML file to index.html if it had a different name
          HTML_NAME=$(basename "$TARGET_HTML")
          if [ "$HTML_NAME" != "index.html" ]; then
            cp "www/$HTML_NAME" www/index.html
          fi
        else
          echo "Error: No HTML file found in repository!"
          exit 1
        fi

        # Initialize Capacitor pointing to 'www'
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Duplicate Class Conflicts & Build APK
      run: |
        cd android

        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'
