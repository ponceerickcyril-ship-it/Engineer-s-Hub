name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper and Build APK
      run: |
        # 1. Force install Gradle 8.7
        sudo wget https://services.gradle.org/distributions/gradle-8.7-bin.zip -P /tmp
        sudo unzip -d /opt/gradle /tmp/gradle-8.7-bin.zip
        export PATH=/opt/gradle/gradle-8.7/bin:$PATH

        # 2. Generate missing gradlew binary
        gradle wrapper --gradle-version 8.7

        # 3. Give execution permissions
        chmod +x gradlew

        # 4. Compile the native Android APK
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
