name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Web Directory & Capacitor
      run: |
        # Create a package.json if missing
        if [ ! -f package.json ]; then
          npm init -y
        fi

        # Install Capacitor
        npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

        # Move web assets into a standard 'www' directory
        mkdir -p www
        find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.json" -o -name "*.png" -o -name "*.jpg" -o -name "*.svg" \) -exec cp {} www/ \;

        # Initialize Capacitor pointing to 'www'
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
