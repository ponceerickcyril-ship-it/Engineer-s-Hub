name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory & Capacitor
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        # Install project dependencies and build web assets if available
        npm install --legacy-peer-deps || true
        npm run build --if-present || true

        mkdir -p www

        # Copy build output or static assets to www
        if [ -d "dist" ]; then
          cp -R dist/* www/
        elif [ -d "build" ]; then
          cp -R build/* www/
        else
          node -e '
            const fs = require("fs");
            const path = require("path");
            const www = path.join(process.cwd(), "www");
            const ignore = [".git", ".github", "node_modules", "android", "www"];
            fs.readdirSync(".").forEach(f => {
              if (!ignore.includes(f)) fs.cpSync(f, path.join(www, f), { recursive: true });
            });
          '
        fi

        # Fix relative paths in www to prevent white screen issues on Android
        node -e '
          const fs = require("fs");
          const path = require("path");
          const www = path.join(process.cwd(), "www");

          function fixPaths(dir) {
            fs.readdirSync(dir).forEach(file => {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                fixPaths(fullPath);
              } else if (file.endsWith(".html") || file.endsWith(".js") || file.endsWith(".css")) {
                let content = fs.readFileSync(fullPath, "utf8");
                content = content.replace(/src="\/assets\//g, "src=\"./assets/");
                content = content.replace(/href="\/assets\//g, "href=\"./assets/");
                content = content.replace(/src="\//g, "src=\"./");
                content = content.replace(/href="\//g, "href=\"./");
                fs.writeFileSync(fullPath, content);
              }
            });
          }
          if (fs.existsSync(www)) fixPaths(www);
        '

        # Initialize and sync Capacitor
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Conflicts & Build APK
      run: |
        cd android

        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'
