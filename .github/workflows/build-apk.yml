name: Build Android APK from Google AI Studio App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build Google AI Studio React App & Setup Capacitor
      run: |
        # 1. Install project dependencies
        npm install --legacy-peer-deps

        # 2. Add Capacitor dependencies
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        # 3. Build Vite project with relative base path (fixes white screen)
        npx vite build --base ./

        # 4. Verify 'dist' folder exists and copy to 'www'
        mkdir -p www
        if [ -d "dist" ]; then
          cp -R dist/* www/
        fi

        # 5. Initialize & Sync Capacitor pointing to compiled dist assets
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Conflicts & Build APK
      run: |
        cd android

        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'
