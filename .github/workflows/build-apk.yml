name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory & Capacitor
      run: |
        # Create package.json if missing
        if [ ! -f package.json ]; then
          npm init -y
        fi

        # Install Capacitor packages
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        # Create output www folder
        mkdir -p www

        # Copy all contents from repo to www
        cp -R ./* www/ 2>/dev/null || true

        # Ensure index.html exists in www
        if [ ! -f www/index.html ]; then
          FOUND_HTML=$(find . -name "*.html" -not -path "./www/*" -not -path "./node_modules/*" | head -n 1)
          if [ -n "$FOUND_HTML" ]; then
            cp "$FOUND_HTML" www/index.html
          else
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>App</title></head><body><h1>App Loaded</h1></body></html>' > www/index.html
          fi
        fi

        # Initialize Capacitor pointing to 'www'
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Duplicate Class Conflicts & Build APK
      run: |
        cd android

        # Inject resolution strategy flags into gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        # Force Gradle to substitute legacy jdk7/jdk8 libraries with the main stdlib
        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
