name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory & Capacitor
      run: |
        # Initialize package.json if missing
        if [ ! -f package.json ]; then
          npm init -y
        fi

        # Install Capacitor
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        # Create www directory safely via Node.js
        node -e '
          const fs = require("fs");
          const path = require("path");

          const www = path.join(process.cwd(), "www");
          if (!fs.existsSync(www)) fs.mkdirSync(www, { recursive: true });

          const ignore = [".git", ".github", "node_modules", "android", "www"];
          
          fs.readdirSync(".").forEach(file => {
            if (!ignore.includes(file)) {
              fs.cpSync(file, path.join(www, file), { recursive: true });
            }
          });

          // Ensure an index.html exists
          if (!fs.existsSync(path.join(www, "index.html"))) {
            const files = fs.readdirSync(www, { recursive: true });
            const htmlFile = files.find(f => f.endsWith(".html"));
            if (htmlFile) {
              fs.copyFileSync(path.join(www, htmlFile), path.join(www, "index.html"));
            }
          }
        '

        # Initialize and sync Capacitor
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Conflicts & Build APK
      run: |
        cd android

        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'
