name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle & Build
      run: |
        # Download the required Gradle 9.3.1 version directly
        wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
        unzip -q gradle-9.3.1-bin.zip
        export PATH=$PWD/gradle-9.3.1/bin:$PATH

        # Generate wrapper and build
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --info

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
