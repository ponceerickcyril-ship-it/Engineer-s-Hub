name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory & Capacitor
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

        # Install dependencies safely
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        # Run web build if package.json contains a build script
        npm run build --if-present || true

        # Create output directory
        mkdir -p www

        # Copy built assets (dist or build folder) into www if they exist, otherwise copy root
        if [ -d "dist" ]; then
          cp -R dist/* www/
        elif [ -d "build" ]; then
          cp -R build/* www/
        else
          node -e '
            const fs = require("fs");
            const path = require("path");
            const www = path.join(process.cwd(), "www");
            const ignore = [".git", ".github", "node_modules", "android", "www"];
            fs.readdirSync(".").forEach(f => {
              if (!ignore.includes(f)) fs.cpSync(f, path.join(www, f), { recursive: true });
            });
          '
        fi

        # Guarantee an index.html file exists inside www no matter what
        node -e '
          const fs = require("fs");
          const path = require("path");
          const www = path.join(process.cwd(), "www");
          const indexPath = path.join(www, "index.html");

          if (!fs.existsSync(indexPath)) {
            // Find any html file inside www
            const findHtml = (dir) => {
              for (const file of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  const res = findHtml(fullPath);
                  if (res) return res;
                } else if (file.endsWith(".html")) {
                  return fullPath;
                }
              }
              return null;
            };

            const found = findHtml(www);
            if (found) {
              fs.copyFileSync(found, indexPath);
            } else {
              fs.writeFileSync(indexPath, "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>App</title></head><body><div id=\"root\"></div></body></html>");
            }
          }
        '

        # Initialize and sync Capacitor
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Conflicts & Build APK
      run: |
        cd android

        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'
