name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory & Capacitor
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        mkdir -p www

        # Copy static files safely into www
        node -e '
          const fs = require("fs");
          const path = require("path");
          const www = path.join(process.cwd(), "www");
          const ignore = [".git", ".github", "node_modules", "android", "www"];
          
          fs.readdirSync(".").forEach(f => {
            if (!ignore.includes(f)) {
              fs.cpSync(f, path.join(www, f), { recursive: true });
            }
          });

          // Ensure index.html exists inside www
          const indexPath = path.join(www, "index.html");
          if (!fs.existsSync(indexPath)) {
            const findHtml = (dir) => {
              for (const file of fs.readdirSync(dir)) {
                const full = path.join(dir, file);
                if (fs.statSync(full).isDirectory()) {
                  const res = findHtml(full);
                  if (res) return res;
                } else if (file.endsWith(".html")) {
                  return full;
                }
              }
              return null;
            };
            const found = findHtml(www);
            if (found) fs.copyFileSync(found, indexPath);
          }

          // Patch absolute assets paths to relative paths to fix white screen issue
          function fixPaths(dir) {
            fs.readdirSync(dir).forEach(file => {
              const full = path.join(dir, file);
              if (fs.statSync(full).isDirectory()) {
                fixPaths(full);
              } else if (file.endsWith(".html") || file.endsWith(".js") || file.endsWith(".css")) {
                let content = fs.readFileSync(full, "utf8");
                content = content.replaceAll("=\"/assets/", "=\"./assets/");
                content = content.replaceAll("=\"/", "=\"./");
                fs.writeFileSync(full, content);
              }
            });
          }
          fixPaths(www);
        '

        # Initialize and sync Capacitor
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Conflicts & Build APK
      run: |
        cd android

        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'
