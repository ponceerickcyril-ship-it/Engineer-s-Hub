name: Build Android APK from HTML/JS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Web Directory & Capacitor
      run: |
        # Create package.json if missing
        if [ ! -f package.json ]; then
          npm init -y
        fi

        # Install Capacitor packages
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save-dev

        # Create www directory
        mkdir -p www

        # Copy everything except system/git folders into www
        rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' --exclude='www' ./ www/

        # Ensure index.html exists inside www (find any html file copied to www)
        if [ ! -f www/index.html ]; then
          ANY_HTML=$(find www -type f -name "*.html" | head -n 1)
          if [ -n "$ANY_HTML" ]; then
            cp "$ANY_HTML" www/index.html
          fi
        fi

        # Initialize Capacitor pointing to 'www'
        npx cap init "Engineer's Hub" "com.engineershub.app" --web-dir www
        npx cap add android
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Fix Kotlin Duplicate Class Conflicts & Build APK
      run: |
        cd android

        echo "android.enableJetifier=true" >> gradle.properties
        echo "android.useAndroidX=true" >> gradle.properties

        cat << 'EOF' >> build.gradle
        subprojects {
            configurations.all {
                resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib-jdk')) {
                        details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:${details.requested.version}")
                    }
                }
            }
        }
        EOF

        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/*.apk'
